[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/music/search"
  to = "/.netlify/functions/music-search"
  status = 200

[[redirects]]
  from = "/api/music/play"
  to = "/.netlify/functions/music-play"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/audio/*"
  [headers.values]
    Accept-Ranges = "bytes"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
